<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US 递交准备审核（环节4）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1e293b; font-size: 13px; }
  .layout { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 250px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; transition: width .2s ease; }
  .sidebar.collapsed { width: 36px; }
  .sidebar-header { padding: 10px 12px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-title { font-size: 12px; font-weight: 600; color: #475569; }
  .sidebar.collapsed .sidebar-title, .sidebar.collapsed .sidebar-search, .sidebar.collapsed .sidebar-list { display: none; }
  .sidebar-toggle { background: transparent; border: none; cursor: pointer; padding: 4px 6px; border-radius: 4px; color: #64748b; font-size: 14px; }
  .sidebar-search { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
  .sidebar-search input { width: 100%; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12px; outline: none; }
  .sidebar-list { flex: 1; overflow-y: auto; }
  .sidebar-item { padding: 9px 12px; border-bottom: 1px solid #f8fafc; cursor: pointer; display: flex; gap: 8px; }
  .sidebar-item:hover { background: #f8fafc; }
  .sidebar-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; padding-left: 9px; }
  .sidebar-item .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .dot.pending { background: #3b82f6; } .dot.skipped { background: #cbd5e1; } .dot.done { background: #10b981; }
  .sidebar-item .row1 { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-item .row2 { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .sidebar-empty { padding: 24px 12px; text-align: center; color: #cbd5e1; font-size: 12px; }
  .main { flex: 1; display: flex; min-width: 0; }
  .form-pane { flex: 1; overflow-y: auto; padding: 16px 20px; min-width: 0; }
  .preview-pane { width: 46%; border-left: 1px solid #e2e8f0; background: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .badge.pending { background: #dbeafe; color: #1d4ed8; }
  .badge.done { background: #d1fae5; color: #047857; }
  .badge.skipped { background: #e2e8f0; color: #64748b; }
  .topbar .spacer { flex: 1; }
  button { cursor: pointer; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; padding: 7px 14px; font-size: 12.5px; color: #334155; }
  button:hover { background: #f8fafc; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.success { background: #059669; border-color: #059669; color: #fff; }
  button.success:hover { background: #047857; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 12.5px; line-height: 1.7; }
  .banner.warn { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; }
  .banner.ok { background: #d1fae5; border: 1px solid #6ee7b7; color: #047857; }
  .section { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .section-head { padding: 9px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 13px; color: #334155; }
  .section-body { padding: 12px 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px 14px; }
  .field label { display: block; font-size: 11.5px; color: #64748b; margin-bottom: 3px; }
  .field input, .field select, .field textarea { width: 100%; padding: 6px 9px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 12.5px; outline: none; background: #fff; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #3b82f6; }
  .field input[readonly] { background: #f8fafc; color: #64748b; }
  .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
  .checks label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #334155; cursor: pointer; }
  .checks input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; }
  .docrow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; }
  .docrow a { color: #2563eb; text-decoration: none; }
  .docrow .del { color: #dc2626; cursor: pointer; font-size: 11.5px; border: none; background: none; padding: 0 4px; }
  .preview-head { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .preview-head .tab { padding: 4px 12px; border-radius: 6px; font-size: 12px; border: 1px solid #e2e8f0; background: #fff; }
  .preview-head .tab.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .preview-body { flex: 1; position: relative; }
  .preview-body iframe { width: 100%; height: 100%; border: none; }
  .preview-placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 13px; text-align: center; padding: 0 20px; line-height: 2; }
  .preview-loading { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(255,255,255,.9); z-index: 6; color: #475569; font-size: 13px; }
  .preview-loading.show { display: flex; }
  .spinner { width: 32px; height: 32px; border: 3px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 560px; max-width: 92vw; max-height: 88vh; overflow-y: auto; padding: 18px 20px; }
  .modal h3 { font-size: 15px; margin-bottom: 12px; }
  .modal .field { margin-bottom: 10px; }
  .modal .attach-list { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px 12px; font-size: 12px; line-height: 1.9; margin-bottom: 10px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; padding: 9px 18px; border-radius: 8px; font-size: 12.5px; z-index: 99; display: none; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">递交准备待办</span>
      <button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">&#9776;</button>
    </div>
    <div class="sidebar-search"><input id="sidebarSearch" placeholder="按案号筛选..." oninput="renderSidebar()"></div>
    <div style="padding:0 10px 8px;display:flex;gap:6px;">
      <button class="primary" style="flex:1;padding:6px;" onclick="transferIn()">+ 转入递交准备</button>
      <button style="padding:6px 8px;white-space:nowrap;" onclick="openSignModal()" title="客户回签后在此勾选，自动转入递交准备">待回签</button>
    </div>
    <div class="sidebar-list" id="sidebarList"><div class="sidebar-empty">加载中...</div></div>
  </aside>

  <div class="main">
    <div class="form-pane">
      <div class="topbar">
        <h1 id="caseTitle">—</h1>
        <span class="badge pending" id="statusBadge">…</span>
        <span class="spacer"></span>
        <button class="primary" id="saveBtn" onclick="save()" disabled>保存</button>
        <button class="success" id="sendBtn" onclick="openSendModal()" disabled>发美代理</button>
      </div>
      <div id="warnBanner"></div>
      <div id="formSections"><div class="banner ok">从左侧选择一个递交准备任务。</div></div>
    </div>

    <div class="preview-pane">
      <div class="preview-head">
        <span style="font-size:12px;color:#64748b;">预览：</span>
        <button class="tab" data-target="poa" onclick="preview('poa')">POA</button>
        <button class="tab" data-target="transmittal" onclick="preview('transmittal')">Transmittal</button>
        <button class="tab" data-target="ads" onclick="preview('ads')">ADS</button>
        <button class="tab" data-target="email" onclick="previewEmail()">美代理邮件</button>
      </div>
      <div id="dlBar" style="display:none;padding:6px 12px;background:#fef3c7;border-bottom:1px solid #fcd34d;font-size:12px;"></div>
      <div class="preview-body">
        <iframe id="previewFrame" style="display:none"></iframe>
        <div class="preview-placeholder" id="previewPlaceholder">填好递交清单后点上方按钮生成预览<br>POA/Transmittal 内联显示；ADS 在线为扁平化预览版、下载用 XFA 版</div>
        <div id="emailPreview" style="display:none;position:absolute;inset:0;overflow:auto;padding:16px;background:#f1f5f9;"></div>
        <div class="preview-loading" id="previewLoading"><div class="spinner"></div><div id="previewLoadingText">生成中…</div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="sendModal">
  <div class="modal">
    <h3>发送给美国代理人</h3>
    <div class="field"><label>收件人（美代理，多个用逗号分隔）<span style="color:#dc2626">*</span></label><input id="mTo" placeholder="agent@example.com"></div>
    <div class="field"><label>抄送</label><input id="mCc"></div>
    <div class="field"><label>主题</label><input id="mSubject"></div>
    <div class="field"><label>正文（与页面「给美代理邮件」同步，此处可最后微调）</label><textarea id="mBody" rows="6"></textarea></div>
    <div class="field"><label>附件（确认发送时生成）</label><div class="attach-list" id="mAttach"></div></div>
    <div id="mWarn"></div>
    <div class="actions">
      <button onclick="closeSendModal()">取消</button>
      <button class="success" id="mConfirm" onclick="doConfirm()">确认并发送</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="signModal">
  <div class="modal">
    <h3>待回签案件（已发客户签署）</h3>
    <p style="font-size:12px;color:#64748b;margin:4px 0 10px;">客户签回 POA/Transmittal 后点「已收到签署」，该案自动转入递交准备并发审阅链接。定时任务也会自动转入已标记的案件。<br>机审判为「缺件」的案件也在下方列出（红标）：若确认是误判，点「确认无误·强制转入递交」即可推进。</p>
    <div id="signList" style="max-height:50vh;overflow-y:auto;">加载中...</div>
    <div class="actions"><button onclick="closeSignModal()">关闭</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const LIST_API = "/api/submission/tasks";   // 复用环节2 列表（按 type 过滤）
const API = "/api/submission/filing";
let taskId = null, taskList = [], data = null, fields = {}, opts = {}, mailState = {subject:"", body:""};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
function toast(m, ms=2600){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", ms); }
async function api(method, url, body, isForm){
  const opt = { method };
  if (isForm) { opt.body = body; }
  else if (body !== undefined) { opt.headers = {"Content-Type":"application/json"}; opt.body = JSON.stringify(body); }
  const r = await fetch(url, opt);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail || j));
  return j;
}

async function loadTaskList(){
  try {
    const j = await api("GET", `${LIST_API}?type=filing_preparation&status=pending,skipped,done`);
    taskList = j.tasks || [];
  } catch(e){ taskList = []; }
  renderSidebar();
}
function renderSidebar(){
  const kw = ($("sidebarSearch").value || "").toLowerCase();
  const items = taskList.filter(t => !kw || (t.case_volume||"").toLowerCase().includes(kw));
  $("sidebarList").innerHTML = items.length ? items.map(t => `
    <div class="sidebar-item ${t.id===taskId?"active":""}" onclick="openTask('${esc(t.id)}')">
      <span class="dot ${esc(t.status)}"></span>
      <div><div class="row1">${esc(t.case_volume)}</div><div class="row2">${esc(t.status)}</div></div>
    </div>`).join("") : '<div class="sidebar-empty">无递交准备任务</div>';
}

async function transferIn(){
  const cv = (prompt("输入要转入的代理所案号（须已有该案的确认函/filing_confirmation 任务）：")||"").trim();
  if (!cv) return;
  try {
    const j = await api("POST", `${API}/create?case_volume=${encodeURIComponent(cv)}`);
    toast(j.existed ? "该案已转入，打开现有任务"
                    : (j.notified ? "已转入并发出审阅链接" : "已转入（未配审阅人，未发链接）"));
    await loadTaskList();
    await openTask(j.task_id);
  } catch(e){ toast("转入失败: "+e.message); }
}

function closeSignModal(){ $("signModal").classList.remove("show"); }
async function openSignModal(){
  $("signModal").classList.add("show");
  $("signList").innerHTML = "加载中...";
  try {
    const j = await api("GET", "/api/submission/signatures?status=pending,needs_fix");
    const rows = j.tasks || [];
    $("signList").innerHTML = rows.length ? rows.map(t => {
      const nf = t.status === "needs_fix";
      const miss = (t.review_missing || []).map(m => esc(m)).join("；");
      return `
      <div style="display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #f1f5f9;${nf?"background:#fef2f2;":""}">
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:500;">${esc(t.case_volume)}${nf?" <span style='color:#dc2626;font-size:11px;'>机审：缺件</span>":""}</div>
          <div style="font-size:11px;color:#94a3b8;">发出 ${esc((t.updated_at||t.created_at||"").slice(0,16))}${t.transferred?" · <span style='color:#16a34a'>已转入</span>":""}</div>
          ${nf&&miss?`<div style="font-size:11px;color:#dc2626;margin-top:2px;">判缺：${miss}</div>`:""}
        </div>
        <button class="success" style="padding:5px 10px;" onclick="markSigned('${esc(t.id)}', ${nf})">${nf?"确认无误·强制转入递交":"已收到签署"}</button>
      </div>`;
    }).join("") : '<div style="padding:20px;text-align:center;color:#cbd5e1;">无待回签案件</div>';
  } catch(e){ $("signList").innerHTML = '<div style="padding:20px;color:#dc2626;">加载失败: '+esc(e.message)+'</div>'; }
}
async function markSigned(id, isNeedsFix){
  if (isNeedsFix && !confirm("该案机审判为「缺件」。确认为误判、强制转入递交准备？")) return;
  try {
    const j = await api("POST", `/api/submission/signatures/${encodeURIComponent(id)}/mark-signed`);
    toast(j.existed ? "已标记签署（该案此前已转入）"
                    : (j.notified ? "已签署并转入、发出审阅链接" : "已签署并转入（未配审阅人，未发链接）"));
    closeSignModal();
    await loadTaskList();
    if (j.filing_task_id) await openTask(j.filing_task_id);
  } catch(e){ toast("标记失败: "+e.message); }
}

async function openTask(id){
  taskId = id;
  try { data = await api("GET", `${API}/${id}`); }
  catch(e){ toast("加载失败: "+e.message); return; }
  fields = data.fields_json || {};
  opts = data.transmittal_options || {};
  initMail();
  $("caseTitle").textContent = data.case_volume || "—";
  const b = $("statusBadge"); b.textContent = data.status; b.className = "badge " + data.status;
  const ro = data.status !== "pending";
  $("saveBtn").disabled = ro; $("sendBtn").disabled = ro;
  renderForm();
  renderSidebar();
  history.replaceState(null, "", `/submission/filing/${id}`);
}

function _v(path){ return path.split(".").reduce((o,k)=> o==null?undefined:o[k], fields); }
function renderForm(){
  const ci = fields.case_info || {};
  const ap = (fields.applicants||[])[0] || {};
  const invs = (fields.inventors||[]).map(i=>i.full_name_en||`${i.first_name_en||""} ${i.last_name_en||""}`).filter(Boolean).join("；");
  const docs = (data.final_docs||[]).map(d=>`<div class="docrow">📄 <a href="${esc(d.url)}" target="_blank">${esc(d.name)}</a><button class="del" onclick="delFinal('${esc(d.name)}')">删除</button></div>`).join("") || '<div style="color:#94a3b8;font-size:12px;">尚未上传定稿</div>';
  const ck = (k)=> opts[k] ? "checked" : "";
  $("formSections").innerHTML = `
    <div class="section"><div class="section-head">案件信息（来自 fields_json，只读）</div><div class="section-body grid">
      <div class="field"><label>代理所案号</label><input readonly value="${esc(fields.case_volume||"")}"></div>
      <div class="field"><label>申请名称</label><input readonly value="${esc(ci.case_name_en||"")}"></div>
      <div class="field"><label>申请人</label><input readonly value="${esc(ap.applicant_name_en||"")}"></div>
      <div class="field"><label>发明人</label><input readonly value="${esc(invs)}"></div>
      <div class="field"><label>主题(Subject Matter)</label><input readonly value="${esc(fields.subject_matter||"")}"></div>
    </div></div>

    <div class="section"><div class="section-head">递交清单（transmittal_options）</div><div class="section-body">
      <div class="grid">
        <div class="field"><label>实体</label><select id="o-entity">
          <option value="large" ${opts.entity==="large"?"selected":""}>大实体</option>
          <option value="small" ${opts.entity==="small"?"selected":""}>小实体</option>
          <option value="micro" ${opts.entity==="micro"?"selected":""}>微实体</option>
        </select></div>
        <div class="field"><label>说明书页数</label><input id="o-spec" value="${esc(opts.spec_pages||"")}"></div>
        <div class="field"><label>附图页数</label><input id="o-draw" value="${esc(opts.drawing_sheets||"")}"></div>
        <div class="field"><label>Declaration 页数</label><input id="o-decl" value="${esc(opts.declaration_pages||"")}"></div>
      </div>
      <div style="margin:10px 0 6px;font-size:11.5px;color:#64748b;">随附文件（勾选本次实际递交的）</div>
      <div class="checks">
        <label><input type="checkbox" id="o-has_declaration" ${ck("has_declaration")}>Declaration（声明）</label>
        <label><input type="checkbox" id="o-has_poa" ${ck("has_poa")}>POA（委托书）</label>
        <label><input type="checkbox" id="o-has_ids" ${ck("has_ids")}>IDS</label>
        <label><input type="checkbox" id="o-has_preliminary_amendment" ${ck("has_preliminary_amendment")}>Preliminary Amendment</label>
        <label><input type="checkbox" id="o-has_sequence_listing" ${ck("has_sequence_listing")}>序列表</label>
        <label><input type="checkbox" id="o-has_assignment" ${ck("has_assignment")}>Assignment</label>
        <label><input type="checkbox" id="o-has_ads" ${opts.has_ads!==false?"checked":""}>ADS</label>
      </div>
      <div class="field" style="margin-top:10px;"><label>备注</label><input id="o-remark" value="${esc(opts.remark||"")}"></div>
    </div></div>

    <div class="section"><div class="section-head">定稿文件（说明书/权要/附图终版，手动上传）</div><div class="section-body">
      <div id="finalDocs">${docs}</div>
      <div style="margin-top:8px;"><input type="file" id="finalFile"> <button onclick="uploadFinal()">上传定稿</button></div>
    </div></div>

    <div class="section"><div class="section-head">给美代理邮件（正文可编辑，右侧「美代理邮件」tab 预览；随「保存」落库）</div><div class="section-body">
      <div class="field"><label>主题</label><input id="m-subject" style="width:100%;box-sizing:border-box;" value="${esc(mailState.subject)}" oninput="setMail({subject:this.value});syncEmailPreview()"></div>
      <div class="field"><label>正文</label><textarea id="m-body" rows="9" style="width:100%;box-sizing:border-box;font-family:inherit;" oninput="setMail({body:this.value});syncEmailPreview()">${esc(mailState.body)}</textarea></div>
      <div style="font-size:11px;color:#94a3b8;margin-top:6px;">附件：POA / Transmittal / ADS（确认发送时生成）+ 已上传定稿</div>
    </div></div>`;
}

function collectOpts(){
  if (!$("o-entity")) return opts;
  opts = {
    entity: $("o-entity").value,
    spec_pages: $("o-spec").value.trim(),
    drawing_sheets: $("o-draw").value.trim(),
    declaration_pages: $("o-decl").value.trim(),
    has_declaration: $("o-has_declaration").checked,
    has_poa: $("o-has_poa").checked,
    has_ids: $("o-has_ids").checked,
    has_preliminary_amendment: $("o-has_preliminary_amendment").checked,
    has_sequence_listing: $("o-has_sequence_listing").checked,
    has_assignment: $("o-has_assignment").checked,
    has_ads: $("o-has_ads").checked,
    remark: $("o-remark").value.trim(),
  };
  return opts;
}

async function save(){
  collectOpts();
  try { await api("POST", `${API}/${taskId}/save`, { fields_json: fields, transmittal_options: opts }); toast("已保存"); }
  catch(e){ toast("保存失败: "+e.message); }
}

// 只刷新定稿文件列表，保留内存里未保存的表单编辑（避免全量 openTask 重载打回服务器状态）
async function refreshFinalDocs(){
  const fresh = await api("GET", `${API}/${taskId}`);
  data.final_docs = fresh.final_docs || [];
  renderForm();
}
async function uploadFinal(){
  const f = $("finalFile").files[0];
  if (!f) { toast("请先选择文件"); return; }
  collectOpts();                                   // 快照当前编辑，防重渲染丢失
  const fd = new FormData(); fd.append("file", f);
  try { await api("POST", `${API}/${taskId}/upload-final`, fd, true); toast("上传成功"); await refreshFinalDocs(); }
  catch(e){ toast("上传失败: "+e.message); }
}
async function delFinal(name){
  collectOpts();                                   // 同上，删除也只刷新文件列表
  try { await api("DELETE", `${API}/${taskId}/final/${encodeURIComponent(name)}`); await refreshFinalDocs(); }
  catch(e){ toast("删除失败: "+e.message); }
}

async function preview(target){
  collectOpts();
  $("emailPreview").style.display = "none";
  // 高亮当前 tab + 显示 loading 遮罩（ADS 走 pdfRest 扁平化，较慢，文案区分）
  document.querySelectorAll(".preview-head .tab").forEach(b => b.classList.toggle("active", b.dataset.target === target));
  $("previewLoadingText").textContent = target === "ads" ? "生成中…（ADS 扁平化稍慢）" : "生成中…";
  $("previewLoading").classList.add("show");
  try {
    const j = await api("POST", `${API}/${taskId}/preview`, { target, fields_json: fields, transmittal_options: opts });
    const file = (j.files||[])[0];
    if (!file) { toast("未生成文件"); return; }
    // 数据核对版（含 ADS）内联显示；ADS 额外给 XFA 下载条
    $("previewPlaceholder").style.display = "none";
    const fr = $("previewFrame"); fr.style.display = "block"; fr.src = file.pdf_url;
    const bar = $("dlBar");
    if (target === "ads" && file.download_url) {
      bar.style.display = "block";
      bar.innerHTML = `当前为<b>扁平化预览版</b>（在线浏览，表单原样）。正式递交/发送用 XFA 版：` +
        `<a href="${esc(file.download_url)}" target="_blank" style="color:#b45309;font-weight:600;">⬇ 下载 ${esc(file.download_name||"ADS.pdf")}</a>（需 Adobe 打开）`;
    } else {
      bar.style.display = "none";
    }
    if ((j.warnings||[]).length) toast(j.warnings[0]);
  } catch(e){ toast("预览失败: "+e.message); }
  finally { $("previewLoading").classList.remove("show"); }
}

// 美代理邮件默认模板（首次进入用；之后以编辑后的 mailState 为准）
function mailTemplate(name){
  const cv = data.case_volume || "";
  return {
    subject: `${cv} 递交文件签署`,
    body: `${name}，您好，\n\n烦请签署题述 POA、Transmittal 文件，其他文件已通过 DocuSign 发送，谢谢。\n\n祝好！\n成萍`,
  };
}
// 初始化邮件：已存 fields.agent_mail 则恢复编辑值，否则用默认模板
function initMail(){
  const saved = (fields && fields.agent_mail) || null;
  mailState = (saved && (saved.body || saved.subject))
    ? { subject: saved.subject || "", body: saved.body || "" }
    : mailTemplate("X总/X律师");
}
// 写编辑值到 mailState 并镜像进 fields.agent_mail（随「保存」落库）
function setMail(patch){
  Object.assign(mailState, patch);
  fields.agent_mail = { subject: mailState.subject, body: mailState.body };
}
function syncEmailPreview(){ if ($("emailPreview") && $("emailPreview").style.display !== "none") previewEmail(); }
function attachSummaryHtml(){
  const gen = ["POA", "Transmittal", "ADS（需 Adobe）"];
  const finals = (data.final_docs||[]).map(d=>d.name);
  return "生成成品：" + gen.join("、") + "<br>定稿：" + (finals.length ? finals.map(esc).join("、") : "（未上传）");
}
// 右侧预览美代理邮件（白纸卡片，宋体/Times 12pt，与环节2 确认邮件预览同款；渲染 mailState）
function previewEmail(){
  if (!taskId) { toast("请先从左侧选择任务"); return; }
  document.querySelectorAll(".preview-head .tab").forEach(b => b.classList.toggle("active", b.dataset.target === "email"));
  $("previewFrame").style.display = "none";
  $("dlBar").style.display = "none";
  $("previewPlaceholder").style.display = "none";
  $("previewLoading").classList.remove("show");
  const bodyHtml = esc(mailState.body).replace(/\n/g, "<br>");
  const div = $("emailPreview");
  div.style.display = "block";
  div.innerHTML = `<div style="background:#fff;min-height:620px;padding:36px 40px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-radius:4px;font-family:宋体,'SimSun','Times New Roman',serif;font-size:12pt;line-height:1.5;color:#000;">
    <div style="font-weight:600;border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:16px;">主题：${esc(mailState.subject)}</div>
    <div>${bodyHtml}</div>
    <div style="margin-top:24px;padding-top:12px;border-top:1px dashed #cbd5e1;font-size:10.5pt;color:#64748b;">附件 —— ${attachSummaryHtml()}</div>
  </div>`;
}
function openSendModal(){
  if (!taskId) return;
  collectOpts();
  $("mTo").value = ""; $("mCc").value = "";
  $("mSubject").value = mailState.subject;
  $("mBody").value = mailState.body;
  $("mSubject").oninput = () => { setMail({subject: $("mSubject").value}); syncEmailPreview(); };
  $("mBody").oninput = () => { setMail({body: $("mBody").value}); syncEmailPreview(); };
  $("mAttach").innerHTML = attachSummaryHtml();
  $("sendModal").classList.add("show");
}
function closeSendModal(){ $("sendModal").classList.remove("show"); }
async function doConfirm(){
  const recipients = $("mTo").value.split(/[,，;；]/).map(s=>s.trim()).filter(Boolean);
  if (!recipients.length) { toast("收件人不能为空"); return; }
  const cc = $("mCc").value.split(/[,，;；]/).map(s=>s.trim()).filter(Boolean);
  $("mConfirm").disabled = true;
  try {
    const j = await api("POST", `${API}/${taskId}/confirm`, {
      fields_json: fields, transmittal_options: opts, recipients, cc,
      recipient_name: "", subject: mailState.subject, body: mailState.body,
    });
    toast("已发送，任务完成");
    closeSendModal(); await loadTaskList(); await openTask(taskId);
  } catch(e){ toast("发送失败: "+e.message); }
  finally { $("mConfirm").disabled = false; }
}

(function init(){
  loadTaskList();
  const m = location.pathname.match(/\/submission\/filing\/([\w-]+)$/);
  if (m) openTask(m[1]);
})();
</script>
</body>
</html>
