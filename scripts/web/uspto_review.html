<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USPTO 上传文件预览（环节8）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #1e293b; font-size: 13px; }
  .layout { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 320px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-header { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; }
  .sidebar-header h1 { font-size: 15px; }
  .sidebar-header .case { font-size: 12px; color: #64748b; margin-top: 3px; word-break: break-all; }
  .sidebar-header .root { font-size: 11px; color: #94a3b8; margin-top: 4px; word-break: break-all; }
  .file-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .group-title { font-size: 11px; font-weight: 700; color: #475569; padding: 10px 14px 4px; text-transform: none; letter-spacing: .3px; }
  .group-title .cnt { color: #94a3b8; font-weight: 500; }
  .file-item { padding: 9px 14px; border-bottom: 1px solid #f8fafc; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .file-item:hover { background: #f8fafc; }
  .file-item.active { background: #eff6ff; border-left: 3px solid #3b82f6; padding-left: 11px; }
  .file-item .ico { flex-shrink: 0; font-size: 14px; }
  .file-item .meta { min-width: 0; flex: 1; }
  .file-item .fname { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-item .fsize { font-size: 11px; color: #94a3b8; margin-top: 2px; }
  .file-item .dl { flex-shrink: 0; font-size: 11px; color: #2563eb; text-decoration: none; padding: 2px 6px; border: 1px solid #dbeafe; border-radius: 5px; }
  .file-item .dl:hover { background: #eff6ff; }
  .empty { padding: 20px 14px; color: #cbd5e1; font-size: 12px; text-align: center; }
  .preview { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
  .preview-bar { padding: 9px 14px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; background: #f8fafc; }
  .preview-bar .title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview-bar .spacer { flex: 1; }
  .preview-bar a { font-size: 12px; color: #2563eb; text-decoration: none; }
  .preview-body { flex: 1; min-height: 0; }
  .preview-body iframe { width: 100%; height: 100%; border: none; }
  .preview-hint { display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8; font-size: 13px; padding: 20px; text-align: center; }
  .banner { background: #ecfdf5; color: #047857; border-bottom: 1px solid #a7f3d0; padding: 7px 14px; font-size: 12px; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>USPTO 上传文件预览</h1>
      <div class="case" id="caseLabel">加载中…</div>
      <div class="root" id="rootLabel"></div>
    </div>
    <div class="banner">环节7 已上传至 Patent Center（存草稿）。以下为该案实际上传的全套文件，请核对后在 Patent Center 正式递交。</div>
    <div class="file-list" id="fileList"><div class="empty">加载中…</div></div>
  </aside>
  <main class="preview">
    <div class="preview-bar">
      <span class="title" id="pvTitle">未选择文件</span>
      <span class="spacer"></span>
      <a id="pvOpen" href="#" target="_blank" style="display:none;">新窗口打开 ↗</a>
    </div>
    <div class="preview-body" id="pvBody">
      <div class="preview-hint">从左侧选择一个 PDF 文件预览；非 PDF 文件点「下载」查看。</div>
    </div>
  </main>
</div>
<script>
  // 案号从 URL 路径尾段取：/submission/uspto-review/{案号}
  const parts = location.pathname.split("/").filter(Boolean);
  const CASE = decodeURIComponent(parts[parts.length - 1] || "");
  const API = "/api/submission/uspto-review/" + encodeURIComponent(CASE);

  function fmtSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / 1024 / 1024).toFixed(2) + " MB";
  }
  function fileUrl(sub, name) {
    return API + "/file?sub=" + encodeURIComponent(sub) + "&name=" + encodeURIComponent(name);
  }

  let activeEl = null;
  function preview(sub, name, isPdf, el) {
    if (activeEl) activeEl.classList.remove("active");
    if (el) { el.classList.add("active"); activeEl = el; }
    const url = fileUrl(sub, name);
    document.getElementById("pvTitle").textContent = name;
    const open = document.getElementById("pvOpen");
    open.href = url; open.style.display = "";
    const body = document.getElementById("pvBody");
    if (isPdf) {
      body.innerHTML = '<iframe src="' + url + '"></iframe>';
    } else {
      body.innerHTML = '<div class="preview-hint">该文件非 PDF，浏览器无法内联预览。<br>请点右上角「新窗口打开」或列表「下载」。</div>';
    }
  }

  function render(data) {
    document.getElementById("caseLabel").textContent = "案号：" + (data.case_volume || CASE);
    document.getElementById("rootLabel").textContent = data.root || "";
    const list = document.getElementById("fileList");
    list.innerHTML = "";
    let total = 0;
    (data.groups || []).forEach(g => {
      const title = document.createElement("div");
      title.className = "group-title";
      title.innerHTML = g.sub + ' <span class="cnt">(' + (g.files || []).length + ')</span>';
      list.appendChild(title);
      if (!(g.files || []).length) {
        const e = document.createElement("div");
        e.className = "empty"; e.textContent = "（空）";
        list.appendChild(e);
        return;
      }
      g.files.forEach(f => {
        total++;
        const item = document.createElement("div");
        item.className = "file-item";
        item.innerHTML =
          '<span class="ico">' + (f.is_pdf ? "📄" : "📎") + '</span>' +
          '<div class="meta"><div class="fname"></div><div class="fsize">' + fmtSize(f.size) + '</div></div>' +
          '<a class="dl" href="' + fileUrl(g.sub, f.name) + '" download>下载</a>';
        item.querySelector(".fname").textContent = f.name;
        item.querySelector(".dl").addEventListener("click", e => e.stopPropagation());
        item.addEventListener("click", () => preview(g.sub, f.name, f.is_pdf, item));
        list.appendChild(item);
      });
    });
    if (!total) list.innerHTML = '<div class="empty">Z 盘归档目录下暂无文件（仅存档 / 签署版）。</div>';
  }

  fetch(API + "/files")
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById("caseLabel").textContent = "案号：" + CASE;
      document.getElementById("fileList").innerHTML =
        '<div class="empty">加载文件清单失败：' + err.message + '</div>';
    });
</script>
</body>
</html>
