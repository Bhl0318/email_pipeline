<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汇报信模板预览</title>
<script src="/static/marked.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f1f5f9; color: #0f172a; }
  header { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .count { font-size: 12px; color: #94a3b8; }
  header .spacer { flex: 1; }
  header button { background: #334155; color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #475569; }
  header button.on { background: #2563eb; color: #fff; }
  .layout { display: flex; align-items: flex-start; }
  aside { width: 300px; flex: none; background: #fff; border-right: 1px solid #e2e8f0; height: calc(100vh - 45px); overflow-y: auto; position: sticky; top: 45px; }
  aside .search { padding: 10px; border-bottom: 1px solid #eef2f6; position: sticky; top: 0; background: #fff; }
  aside .search input { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  .cat { padding: 8px 12px 4px; font-size: 12px; font-weight: 700; color: #64748b; background: #f8fafc; border-top: 1px solid #eef2f6; }
  .cat .n { color: #94a3b8; font-weight: 400; }
  .item { padding: 7px 12px 7px 20px; font-size: 13px; cursor: pointer; border-left: 3px solid transparent; }
  .item:hover { background: #f1f5f9; }
  .item.active { background: #eff6ff; border-left-color: #2563eb; color: #1d4ed8; font-weight: 600; }
  main { flex: 1; padding: 22px; min-width: 0; }
  .toolbar { margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .toolbar .toggle button { background: #fff; border: 1px solid #cbd5e1; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .toolbar .toggle button:first-child { border-radius: 6px 0 0 6px; }
  .toolbar .toggle button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .toolbar .toggle button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
  .toolbar .fname { font-size: 13px; color: #475569; }
  .toolbar .fname code { background: #e2e8f0; padding: 1px 6px; border-radius: 4px; }
  .card { margin: 0 auto 26px; max-width: 820px; }
  .card .meta { font-size: 12px; color: #64748b; margin: 0 0 6px 4px; }
  .card .meta b { color: #0f172a; }
  pre.raw { background: #0f172a; color: #e2e8f0; padding: 18px 20px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

  /* ===== 复用邮件正文样式(与 prototype 邮件正文一致) ===== */
  .email-body { background: #fff; padding: 36px 40px; box-shadow: 0 1px 4px rgba(0,0,0,.08); font-size: 12pt; line-height: 1.5; color: #000; border-radius: 4px; font-family: 宋体, "SimSun", "Times New Roman", serif; }
  .email-body p { margin-bottom: 8px; }
  .email-body strong { font-weight: 700; }
  .email-body em strong, .email-body strong em { font-style: italic; font-weight: 700; }
  .email-body hr { border: none; border-top: 1px solid #999; margin: 14px 0; }
  .email-body table { width: 100%; border-collapse: collapse; margin: 10px 0 16px; font-size: 12pt; }
  .email-body table td, .email-body table th { border: none; padding: 3px 8px 3px 0; text-align: left; vertical-align: top; }
  .email-body table td:first-child { width: 160px; white-space: nowrap; }
  .email-body table thead tr { display: none; }
  /* {{占位符}} 高亮 */
  .email-body .ph { background: #dbeafe; color: #1d4ed8; border-radius: 2px; padding: 0 2px; font-family: -apple-system, sans-serif; font-size: 11px; }
  .empty { color: #94a3b8; text-align: center; margin-top: 80px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>汇报信模板预览</h1>
  <span class="count" id="count"></span>
  <span class="spacer"></span>
  <button id="btnAll" onclick="showAll()">📋 全部堆叠预览</button>
</header>
<div class="layout">
  <aside>
    <div class="search"><input id="search" placeholder="搜索模板名…" oninput="filterList()"></div>
    <div id="nav"></div>
  </aside>
  <main>
    <div class="toolbar" id="toolbar" style="display:none;">
      <span class="toggle">
        <button id="tRender" class="on" onclick="setMode('render')">渲染</button>
        <button id="tRaw" onclick="setMode('raw')">源码</button>
      </span>
      <span class="fname" id="fname"></span>
    </div>
    <div id="view"><div class="empty">← 从左侧选择一个模板，或点右上「全部堆叠预览」</div></div>
  </main>
</div>

<script>
let CATS = [];          // [{name, files:[...]}]
let ALL = [];           // 扁平文件名
let current = null;     // 当前单个文件名
let mode = 'render';    // render | raw

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// md → 邮件正文 HTML（与 prototype 渲染保持一致：breaks、隐藏第3列、隐藏空表头、{{}}高亮）
function renderMd(md){
  let html = marked.parse(md, { breaks: true });
  // 隐藏第 3 列（来源列，若有）
  html = html.replace(/<table>([\s\S]*?)<\/table>/g, (_, inner) => {
    const cleaned = inner.replace(/<tr>([\s\S]*?)<\/tr>/g, (full, trInner) => {
      const cells = trInner.match(/<(td|th)[^>]*>[\s\S]*?<\/\1>/g);
      if (cells && cells.length === 3) return '<tr>' + cells[0] + cells[1] + '</tr>';
      return full;
    });
    return '<table>' + cleaned + '</table>';
  });
  // 空表头行隐藏
  html = html.replace(/<thead>[\s\S]*?<\/thead>/g, '');
  // {{占位符}} 高亮（marked 之后处理，纯文本安全）
  html = html.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, k) => `<span class="ph">{{${esc(k.trim())}}}</span>`);
  return html;
}

async function fetchTpl(name){
  const r = await fetch('/templates/' + encodeURIComponent(name));
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.text();
}

function catOf(name){
  for (const c of CATS) if (c.files.includes(name)) return c.name;
  return '';
}

async function loadOne(name){
  current = name;
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('active', el.dataset.name === name));
  $('btnAll').classList.remove('on');
  $('toolbar').style.display = 'flex';
  $('fname').innerHTML = '<code>' + esc(catOf(name)) + '/' + esc(name) + '</code>';
  const view = $('view');
  view.innerHTML = '<div class="empty">加载中…</div>';
  try {
    const md = await fetchTpl(name);
    view.dataset.md = md;
    paintOne(md);
  } catch(e){
    view.innerHTML = '<div class="empty" style="color:#b91c1c;">加载失败: ' + esc(e.message) + '</div>';
  }
}

function paintOne(md){
  const view = $('view');
  if (mode === 'raw'){
    view.innerHTML = '<div class="card"><pre class="raw">' + esc(md) + '</pre></div>';
  } else {
    view.innerHTML = '<div class="card"><div class="email-body">' + renderMd(md) + '</div></div>';
  }
}

function setMode(m){
  mode = m;
  $('tRender').classList.toggle('on', m === 'render');
  $('tRaw').classList.toggle('on', m === 'raw');
  if ($('btnAll').classList.contains('on')) { showAll(); return; }
  const md = $('view').dataset.md;
  if (md != null) paintOne(md);
}

async function showAll(){
  current = null;
  $('btnAll').classList.add('on');
  document.querySelectorAll('.item').forEach(el => el.classList.remove('active'));
  $('toolbar').style.display = 'flex';
  $('fname').textContent = '共 ' + ALL.length + ' 个模板（' + (mode === 'raw' ? '源码' : '渲染') + '）';
  const view = $('view');
  view.innerHTML = '<div class="empty">加载全部中…</div>';
  const parts = [];
  for (const c of CATS){
    for (const name of c.files){
      let body;
      try {
        const md = await fetchTpl(name);
        body = (mode === 'raw')
          ? '<pre class="raw">' + esc(md) + '</pre>'
          : '<div class="email-body">' + renderMd(md) + '</div>';
      } catch(e){
        body = '<div class="empty" style="color:#b91c1c;">加载失败: ' + esc(e.message) + '</div>';
      }
      parts.push('<div class="card"><p class="meta"><b>' + esc(name) + '</b> · ' + esc(c.name) + '</p>' + body + '</div>');
    }
  }
  view.innerHTML = parts.join('');
}

function filterList(){
  const q = $('search').value.trim().toLowerCase();
  document.querySelectorAll('.item').forEach(el => {
    el.style.display = el.dataset.name.toLowerCase().includes(q) ? '' : 'none';
  });
  document.querySelectorAll('.cat').forEach(cat => {
    let next = cat.nextElementSibling, any = false;
    while (next && next.classList.contains('item')){
      if (next.style.display !== 'none') any = true;
      next = next.nextElementSibling;
    }
    cat.style.display = any ? '' : 'none';
  });
}

function buildNav(){
  const nav = $('nav');
  nav.innerHTML = '';
  for (const c of CATS){
    const h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = esc(c.name) + ' <span class="n">(' + c.files.length + ')</span>';
    nav.appendChild(h);
    for (const name of c.files){
      const it = document.createElement('div');
      it.className = 'item';
      it.dataset.name = name;
      it.textContent = name.replace(/\.md$/, '');
      it.onclick = () => loadOne(name);
      nav.appendChild(it);
    }
  }
}

function $(id){ return document.getElementById(id); }

(async function init(){
  try {
    const r = await fetch('/api/templates');
    const data = await r.json();
    CATS = data.categories || [];
    ALL = CATS.flatMap(c => c.files);
    $('count').textContent = '共 ' + ALL.length + ' 个 · ' + CATS.length + ' 类';
    buildNav();
  } catch(e){
    $('nav').innerHTML = '<div class="empty" style="color:#b91c1c;">加载模板列表失败: ' + esc(e.message) + '</div>';
  }
})();
</script>
</body>
</html>
