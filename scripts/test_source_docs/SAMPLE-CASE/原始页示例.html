<div style="font-family:sans-serif;max-width:640px;margin:40px auto;line-height:1.8;color:#1e293b;">
  <h2>原始页占位文件（测试）</h2>
  <p>这是「原始页」预览功能的测试占位文件。</p>
  <p>正式环境下，这里应是系统最初提取数据、写入 IPEasy 的源文件
     （扫描 PDF / 客户文档等），存放在 NAS 上。</p>
  <p>目录约定：<code>SOURCE_DOC_DIR/&lt;case_volume&gt;/&lt;文件&gt;</code>。
     把本目录 <code>SAMPLE-CASE</code> 改成真实案件方案号即可被对应任务读取。</p>
</div>
